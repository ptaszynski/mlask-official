[build-system]
# PEP 639 (SPDX licence expressions) requires setuptools >= 77 for the
# `license = "<SPDX>"` shorthand below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlask-official"
version = "0.5.0"
description = "ML-Ask Official — high-performance Japanese emotion analysis (original system, Python rewrite)"
readme = "README.md"
# PEP 639: SPDX string + license-files glob, with NO `License ::` classifier.
# (PyPI 2024+ rejects 400 Bad Request when both the licence metadata field and
#  a deprecated `License ::` trove classifier appear together.)
license = "BSD-3-Clause"
license-files = ["LICENSE*"]
authors = [
    {name = "Michal Ptaszynski", email = "ptaszynski@ieee.org"},
]
maintainers = [
    {name = "Michal Ptaszynski", email = "ptaszynski@ieee.org"},
]
keywords = ["nlp", "japanese", "emotion", "sentiment", "affect", "ml-ask", "affective-computing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
]
# Bumped from >=3.9 because:
#  (a) Python 3.9 EOL was October 2025
#  (b) modern streamlit (>=1.51) requires >=3.10
#  (c) on Python 3.9 the streamlit family has a never-fixed 3.9.7 exclusion
#      ("requires Python !=3.9.7, >=3.8"), which makes Poetry-based resolvers
#      (e.g. Streamlit Community Cloud) refuse to install at all.
requires-python = ">=3.10"
dependencies = [
    "mecab-python3>=1.0",
    "pyahocorasick>=2.0",
    "typer>=0.9",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.30",
    "plotly>=5.0",
    "pandas>=2.0",
]
fugashi = [
    "fugashi[unidic-lite]>=1.3",
]
deps = [
    "ginza>=5.1",
    "ja-ginza>=5.1",
]
dev = [
    "pytest>=7.0",
    "pytest-benchmark",
]
all = [
    "streamlit>=1.30",
    "plotly>=5.0",
    "pandas>=2.0",
    "fugashi[unidic-lite]>=1.3",
    "ginza>=5.1",
    "ja-ginza>=5.1",
]

[project.urls]
Homepage = "https://github.com/ptaszynski/mlask-official"
"Bug Tracker" = "https://github.com/ptaszynski/mlask-official/issues"
Changelog = "https://github.com/ptaszynski/mlask-official/blob/main/CHANGELOG.md"
Citation = "https://github.com/ptaszynski/mlask-official/blob/main/CITATION.cff"

[project.scripts]
mlask = "mlask_official.cli:app"

[tool.setuptools.packages.find]
include = ["mlask_official*"]

[tool.setuptools.package-data]
mlask_official = ["emotions/*.txt", "emotemes/*.txt"]
